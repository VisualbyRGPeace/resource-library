<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resource Library — Design Assets</title>
  <meta name="description" content="Design resources and assets. Browse, preview and download mockups, posters, textures and more.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Resource Library — Design Assets">
  <meta property="og:description" content="Design resources and assets. Browse, preview and download.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/"><img src="/favicon.svg" alt="" width="22" height="22">Resource Library</a>
      <div class="header-actions">
        <button class="btn secondary icon" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
      </div>
    </header>

    <section class="hero">
      <h1>Resource Library</h1>
      <p>Design resources and assets.</p>
    </section>

    <div class="toolbar">
      <div class="search"><input id="search" type="search" placeholder="Search resources…" aria-label="Search resources" autocomplete="off"></div>
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="name_asc">Name A–Z</option>
        <option value="name_desc">Name Z–A</option>
        <option value="size_desc">Largest file</option>
        <option value="size_asc">Smallest file</option>
      </select>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>

    <main>
      <div class="grid" id="grid"></div>
      <p class="status" id="status" hidden></p>
      <div class="more" id="more" hidden><button class="btn secondary" id="more-btn" type="button">Load more</button></div>
    </main>
  </div>

  <dialog id="modal" aria-label="Resource preview"></dialog>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
